<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Auto Compress & Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    .container {
      max-width: 640px;
      margin: auto;
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h2 {
      text-align: center;
      margin-top: 0;
    }
    input[type=file] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px dashed #334155;
      background: #1e293b;
      color: #e5e7eb;
      cursor: pointer;
      box-sizing: border-box;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      min-height: 22px;
      color: #38bdf8;
      text-align: center;
      font-weight: 500;
    }
    textarea {
      width: 100%;
      height: 220px;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #22c55e;
      font-size: 13px;
      resize: none;
      box-sizing: border-box;
      font-family: 'Fira Code', monospace;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-clear {
      background: #7f1d1d;
      color: #fecaca;
    }
    .btn-clear:hover {
      background: #991b1b;
    }
    .note {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📤 Auto Compress & Upload</h2>

  <input
    type="file"
    id="files"
    multiple
    accept="image/*,application/pdf"
  >

  <div id="status">Pilih file untuk mulai upload…</div>

  <textarea
    id="result"
    placeholder="Link hasil upload akan muncul di sini"
    readonly
  ></textarea>

  <div class="actions">
    <button class="btn-clear" id="clearBtn">🧹 Bersihkan</button>
  </div>

  <div class="note">
    Kompres otomatis • Tanpa tombol upload • Multi upload
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/browser-image-compression"></script>

<script>
const API_URL = "https://api.ferdev.my.id/remote/elfar";
const API_KEY = "key-elfs";

const input = document.getElementById("files");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const clearBtn = document.getElementById("clearBtn");

input.addEventListener("change", async () => {
  const files = Array.from(input.files);
  if (!files.length) return;

  statusEl.textContent = "⏳ Memproses file...";
  resultEl.value = "";

  for (let i = 0; i < files.length; i++) {
    let file = files[i];

    try {
      // 🔹 Kompres otomatis kalau gambar
      if (file.type.startsWith("image/")) {
        file = await imageCompression(file, {
          maxSizeMB: 0.7,
          maxWidthOrHeight: 1600,
          useWebWorker: true
        });
      }

      const form = new FormData();
      form.append("file", file, file.name);

      const res = await axios.post(API_URL, form, {
        headers: {
          Authorization: `Bearer ${API_KEY}`
        }
      });

      // ✅ Ambil dlink saja
      if (res.data && res.data.dlink) {
        resultEl.value += res.data.dlink + "\n";
      } else {
        resultEl.value += "❌ Link tidak ditemukan\n";
      }

      statusEl.textContent = `✅ Upload ${i + 1} / ${files.length}`;

    } catch (err) {
      console.error(err);
      resultEl.value += `❌ Gagal upload: ${file.name}\n`;
      statusEl.textContent = "⚠️ Ada file yang gagal";
    }
  }

  statusEl.textContent = "🎉 Semua file selesai diproses";
});

// 🧹 Tombol bersihkan
clearBtn.addEventListener("click", () => {
  input.value = "";
  resultEl.value = "";
  statusEl.textContent = "Pilih file untuk mulai upload…";
});
</script>

</body>
</html>
